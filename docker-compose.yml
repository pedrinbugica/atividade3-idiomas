services:
  postgres-idiomas:
    image: postgres:16
    container_name: postgres-idiomas
    restart: unless-stopped
    environment:
      POSTGRES_DB: idiomas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata_idiomas:/var/lib/postgresql/data

volumes:
  pgdata_idiomas: